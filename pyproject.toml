[project]
name = "forgery-detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.1",
    "pyyaml>=6.0",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
]

[dependency-groups]
api = [
    "fastapi>=0.165.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.34",
    "uvicorn>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
